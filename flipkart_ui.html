<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Style UI - জুদো</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <!-- Mobile Screen Container -->
    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative flex flex-col">
        
        <!-- Top Gradient Header Area -->
        <div class="bg-gradient-to-b from-amber-400 via-amber-300 to-amber-100 p-4 pb-2">
            
            <!-- Row 1: Top Shortcuts / Category Cards -->
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-3">
                
                <!-- Card 1 -->
                <div class="bg-white rounded-2xl p-2.5 flex items-center gap-2.5 shadow-sm shrink-0 min-w-[115px] cursor-pointer hover:shadow-md transition">
                    <div class="w-9 h-9 bg-yellow-400 rounded-xl flex items-center justify-center text-blue-900 font-black text-lg italic shadow-inner">F</div>
                    <div>
                        <div class="font-bold text-xs text-gray-900 leading-tight">Flipkart</div>
                        <div class="text-[10px] text-gray-500 font-medium">Explore</div>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="bg-white rounded-2xl p-2.5 flex items-center gap-2.5 shadow-sm shrink-0 min-w-[115px] cursor-pointer hover:shadow-md transition">
                    <div class="w-9 h-9 bg-red-500 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-inner">
                        <i class="fa-solid fa-tags"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-900 leading-tight">Value 365</div>
                        <div class="text-[10px] text-red-600 font-bold">Offers</div>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="bg-white rounded-2xl p-2.5 flex items-center gap-2.5 shadow-sm shrink-0 min-w-[115px] cursor-pointer hover:shadow-md transition">
                    <div class="w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-inner">
                        <i class="fa-solid fa-plane"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-900 leading-tight">Travel</div>
                        <div class="text-[10px] text-gray-500 font-medium">Cheap Flights</div>
                    </div>
                </div>

                <!-- Card 4 -->
                <div class="bg-white rounded-2xl p-2.5 flex items-center gap-2.5 shadow-sm shrink-0 min-w-[115px] cursor-pointer hover:shadow-md transition">
                    <div class="w-9 h-9 bg-green-500 rounded-xl flex items-center justify-center text-white font-bold text-sm shadow-inner">
                        <i class="fa-solid fa-basket-shopping"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-900 leading-tight">Grocery</div>
                        <div class="text-[10px] text-green-600 font-bold">Fast Delivery</div>
                    </div>
                </div>

            </div>

            <!-- Row 2: Location Bar -->
            <div class="flex items-center justify-between bg-white/80 backdrop-blur-sm rounded-xl px-3 py-2 mt-1 shadow-sm">
                <div class="flex items-center gap-2 text-gray-800 text-xs font-semibold truncate">
                    <i class="fa-solid fa-house text-amber-500"></i>
                    <span class="truncate"><span class="font-bold">HOME</span> Bhabani pur hattala, Bhabani...</span>
                </div>
                <i class="fa-solid fa-chevron-down text-gray-600 text-xs shrink-0 ml-2"></i>
            </div>

        </div>

    </div>

</body>
</html>
